# KIPAN broad sweep config (v3 — manuscript version)
# Mirrors: ch3_rerun_kipan_20260330_broad_v3

dataset:
  name: kipan
  features: [rna_seq]

sweep:
  type: broad_v3
  grid:
    lambdas: [3.0e-8, 1.0e-7, 3.0e-7, 1.0e-6, 3.0e-6, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3, 1.0e-2, 2.0e-2, 5.0e-2]
    sigmas: [0.10, 0.15, 0.25, 0.35, 0.50]
    sample_smooth: [0.01, 0.025, 0.05, 0.10]

train:
  hidden_dim: 64
  n_epochs: 100
  lr: 0.001
  seeds: [0, 1, 2, 3, 4]
  cv_folds: 5

outputs:
  - ch3_broad_sweep_configs.csv
